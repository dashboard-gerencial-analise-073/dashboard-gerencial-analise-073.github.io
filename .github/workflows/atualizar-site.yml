# Atualiza os dados e publica o relatório no GitHub Pages.
# - Semanal (terça, 07:00 de Brasília), a cada envio (push) de código/planilha e sob demanda (aba Actions → "Atualizar e publicar relatório" → Run workflow).
# - Data-base = DATA_BASE_PADRAO de pipeline/config.py (fechamento do mês anterior).
# - Se a CVM/BCB ainda não cobrirem a data-base, o site anterior é mantido (sem erro).
name: Atualizar e publicar relatório

on:
  schedule:
    - cron: "0 10 * * 2"
  # Publica também quando código, dashboard ou planilha-base forem enviados ao GitHub.
  push:
    branches: [main]
    paths: ["pipeline/**", "dashboard/**", "data/input/**", "requirements.txt", ".github/workflows/**"]
  workflow_dispatch:
    inputs:
      data_base:
        description: "Data-base (vazio = padrão; 'ultima' ou AAAA-MM-DD)"
        required: false
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      publicar: ${{ steps.pipeline.outputs.publicar }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Downloads da CVM/BCB (~600 MB) e extrações ficam em cache entre execuções.
      - name: Restaurar cache de dados
        uses: actions/cache/restore@v4
        with:
          path: |
            data/raw
            data/cache
          key: dados-${{ github.run_id }}
          restore-keys: dados-

      - name: Rodar pipeline
        id: pipeline
        env:
          TZ: America/Sao_Paulo
        run: |
          set +e
          ARGS=""
          if [ -n "${{ github.event.inputs.data_base }}" ]; then ARGS="--data-base ${{ github.event.inputs.data_base }}"; fi
          python pipeline/build.py $ARGS 2>&1 | tee build.log
          code=${PIPESTATUS[0]}
          if [ "$code" -eq 0 ]; then
            echo "publicar=true" >> "$GITHUB_OUTPUT"
          elif grep -q "NÃO foi gerado\|ainda não publicou\|Ainda não há dados" build.log; then
            echo "::notice::Dados da data-base ainda não disponíveis; site anterior mantido. $(tail -1 build.log)"
            echo "publicar=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi

      - name: Salvar cache de dados
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/raw
            data/cache
          key: dados-${{ github.run_id }}

      - name: Montar site
        if: steps.pipeline.outputs.publicar == 'true'
        run: |
          mkdir -p site
          cp -r dashboard/. site/
          mkdir -p site/downloads
          cp "$(ls -t output/base_fundos_*.xlsx | head -1)" site/downloads/base_fundos.xlsx
          cp "$(ls -t output/Relatorio_Fundos_*.html | head -1)" site/downloads/Relatorio_Fundos.html
          echo 'window.SITE_CONFIG={downloads:true};' > site/data/site.js
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: steps.pipeline.outputs.publicar == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: needs.build.outputs.publicar == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
